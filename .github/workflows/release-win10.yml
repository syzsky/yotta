name: Release Win10

on:
  push:
    tags:
      - 'win10-*'
  workflow_dispatch:

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  build-win10:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version-file: go.mod
          cache: true

      - uses: arduino/setup-protoc@c65c819552d16ad3c9b72d9dfd5ba5237b9c906b
        with:
          version: '30.2'

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          package_json_file: frontend/package.json

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.18.0
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml

      - uses: arduino/setup-task@b91d5d2c96a56797b48ac1e0e89220bf64044611
        with:
          version: 3.49.1

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v3/cmd/wails3@v3.0.0-beta.6

      - name: Install frontend deps
        run: pnpm -C frontend install --frozen-lockfile

      - name: Generate Wails bindings
        run: node frontend/scripts/generate-bindings.mjs

      - name: Build frontend
        run: pnpm -C frontend build

      - name: Build Yotta Win10 (GDI forced)
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path bin | Out-Null
          go build -tags "production force_gdi" -trimpath -ldflags="-w -s -H windowsgui" -o bin/Yotta-Win10-x64.exe .

      - name: Upload artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: yotta-win10-x64
          path: bin/Yotta-Win10-x64.exe

  release:
    needs: build-win10
    runs-on: ubuntu-24.04
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@65a9ec56e389b96c81358f07ee1b5c48de4f4c7d
        with:
          name: yotta-win10-x64

      - name: Create Release
        uses: softprops/action-gh-release@de2c0eb89ae2a093876385947365aca7b0e5f844
        with:
          files: Yotta-Win10-x64.exe
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
